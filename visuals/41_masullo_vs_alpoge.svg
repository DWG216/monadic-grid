<svg width="100%" viewBox="0 0 680 380" role="img"><title>Masullo versus Alpöge in grid terms</title><desc>Two columns: Masullo's frequency-side route and Alpöge's arithmetic-side route, each step labelled with its grid primitive, converging on the mirror step.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="170" y="30" text-anchor="middle">Masullo: frequency side</text>
<text class="th" x="510" y="30" text-anchor="middle">Alpöge: arithmetic side</text>
<g class="c-teal"><rect x="40" y="50" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="69" text-anchor="middle" dominant-baseline="central">Trace formula on C_F</text><text class="ts" x="170" y="88" text-anchor="middle" dominant-baseline="central">Grid: Spec = Geom</text></g>
<g class="c-teal"><rect x="40" y="126" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="145" text-anchor="middle" dominant-baseline="central">Orbital Schauder bases</text><text class="ts" x="170" y="164" text-anchor="middle" dominant-baseline="central">Grid: a clock per doll</text></g>
<g class="c-teal"><rect x="40" y="202" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="221" text-anchor="middle" dominant-baseline="central">Strip squeezed, a → 0</text><text class="ts" x="170" y="240" text-anchor="middle" dominant-baseline="central">Grid: R3, change at limit</text></g>
<g class="c-purple"><rect x="380" y="50" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="69" text-anchor="middle" dominant-baseline="central">Bound G(x) on [Y, Y^3/2]</text><text class="ts" x="510" y="88" text-anchor="middle" dominant-baseline="central">Grid: Win</text></g>
<g class="c-purple"><rect x="380" y="126" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="145" text-anchor="middle" dominant-baseline="central">Theta-lift chains</text><text class="ts" x="510" y="164" text-anchor="middle" dominant-baseline="central">Grid: Θ^√x</text></g>
<g class="c-purple"><rect x="380" y="202" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="221" text-anchor="middle" dominant-baseline="central">Stepanov multiplicity</text><text class="ts" x="510" y="240" text-anchor="middle" dominant-baseline="central">Grid: Pun^m, Bal(W)</text></g>
<line x1="170" y1="106" x2="170" y2="124" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="182" x2="170" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="106" x2="510" y2="124" class="arr" marker-end="url(#arrow)"/><line x1="510" y1="182" x2="510" y2="200" class="arr" marker-end="url(#arrow)"/>
<path d="M170 258 L170 328 L198 328" fill="none" class="arr" marker-end="url(#arrow)"/><path d="M510 258 L510 328 L482 328" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="300" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="319" text-anchor="middle" dominant-baseline="central">No zeros right of ½</text><text class="ts" x="340" y="338" text-anchor="middle" dominant-baseline="central">Grid: M, the mirror closes it</text></g>
</svg>
