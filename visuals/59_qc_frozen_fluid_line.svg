<g font-size="12"><text x="60" y="190" fill="#085041">teal: d² integer (frozen) · classically easy: Gottesman–Knill, exact Jones (JVW)</text>
<text x="60" y="210" fill="#712b13">coral: golden fluid, d = φ (Fibonacci anyons) · BQP-universal (FLW, AJL)</text>
<text x="60" y="230" fill="#633806">amber: finite only at 3 strands (order 60, icosahedral), fluid from 4 strands</text>
<text x="60" y="250" fill="#444">gray: fluid, infinite image</text>
<text x="60" y="280" fill="#222">Frozen ⇔ d² ∈ ℤ ⇔ 2cos(2π/r) ∈ ℤ ⇔ r ∈ {1, 2, 3, 4, 6}, the crystallographic orders.</text>
<text x="60" y="300" fill="#777">Burau check: closed at r = 4, 6, 10 (24, 12, 60); r = 3 unipotent in the Burau form (pre-registered failure, explained in the record).</text></g>
</svg>
