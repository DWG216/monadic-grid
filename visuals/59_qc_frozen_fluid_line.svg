<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="sans-serif"><rect width="720" height="320" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#222">The classical–quantum line is the grid's frozen–fluid line</text>
<text x="20" y="48" font-size="12" fill="#555">Order r of the root of unity (Jones parameter); strand dimension d = 2cos(π/r); 3-strand braid image checked (qc_frozen_fluid.py)</text>
<line x1="60" y1="140" x2="660" y2="140" stroke="#888" stroke-width="1"/>
<g font-size="13" font-weight="bold" text-anchor="middle">
<circle cx="60" cy="140" r="15" fill="#9fe1cb" stroke="#0f6e56"/><text x="60" y="145" fill="#04342c">1</text>
<circle cx="114" cy="140" r="15" fill="#9fe1cb" stroke="#0f6e56"/><text x="114" y="145" fill="#04342c">2</text>
