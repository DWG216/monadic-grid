<circle cx="546" cy="140" r="15" fill="#fac775" stroke="#854f0b"/><text x="546" y="145" fill="#412402">10</text>
<circle cx="600" cy="140" r="13" fill="#d3d1c7" stroke="#5f5e5a"/><text x="600" y="145" fill="#2c2c2a">11</text>
