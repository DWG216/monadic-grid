<svg width="100%" viewBox="0 0 680 430" role="img"><title>Spine of the Lean RH proof mapped to grid primitives</title><desc>RH follows from a one-declaration mirror step and from zero-freeness right of one half for every Dirichlet character. That rests on Green's finite-field characters, a window bound, theta integrals with covolume bounds, and local Langlands; the window bound rests on Galois representations built from a theta lift.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="240" y="30" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">RH (Mathlib's statement)</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Z(W) on Fix(M)</text></g>
<g class="c-teal"><rect x="40" y="130" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="149" text-anchor="middle" dominant-baseline="central">Mirror step</text><text class="ts" x="150" y="168" text-anchor="middle" dominant-baseline="central">M · 1 decl, Mathlib only</text></g>
<g class="c-purple"><rect x="420" y="130" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="530" y="149" text-anchor="middle" dominant-baseline="central">Every character</text><text class="ts" x="530" y="168" text-anchor="middle" dominant-baseline="central">zero-free right of ½</text></g>
<path d="M150 130 L150 58 L238 58" fill="none" class="arr" marker-end="url(#arrow)"/><path d="M530 130 L530 58 L442 58" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="240" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="259" text-anchor="middle" dominant-baseline="central">Green characters</text><text class="ts" x="110" y="278" text-anchor="middle" dominant-baseline="central">finite clocks</text></g>
<g class="c-purple"><rect x="193" y="240" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263" y="259" text-anchor="middle" dominant-baseline="central">Window bound</text><text class="ts" x="263" y="278" text-anchor="middle" dominant-baseline="central">Win · 127k decls</text></g>
<g class="c-purple"><rect x="346" y="240" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="416" y="259" text-anchor="middle" dominant-baseline="central">Theta, covolume</text><text class="ts" x="416" y="278" text-anchor="middle" dominant-baseline="central">Bal, Pun^m · 395k</text></g>
<g class="c-teal"><rect x="499" y="240" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="569" y="259" text-anchor="middle" dominant-baseline="central">Local Langlands</text><text class="ts" x="569" y="278" text-anchor="middle" dominant-baseline="central">local clocks · 9k</text></g>
<path d="M110 240 L110 213 L530 213 L530 188" fill="none" class="arr" marker-end="url(#arrow)"/><path d="M263 240 L263 213" fill="none" class="arr"/><path d="M416 240 L416 213" fill="none" class="arr"/><path d="M569 240 L569 213" fill="none" class="arr"/>
<g class="c-coral"><rect x="153" y="350" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263" y="369" text-anchor="middle" dominant-baseline="central">Galois reps from theta lift</text><text class="ts" x="263" y="388" text-anchor="middle" dominant-baseline="central">Clock = Freq · 166k decls</text></g>
<line x1="263" y1="350" x2="263" y2="298" class="arr" marker-end="url(#arrow)"/>
</svg>
