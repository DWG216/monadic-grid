<text x="410" y="90" font-size="13" font-weight="bold" fill="#222">Verified (pre-registered)</text>
<text x="410" y="112" font-size="13"  fill="#166534">EQN 10, 11: hold for all x, r, a</text>
<text x="410" y="134" font-size="13"  fill="#166534">Lucas = 5×F; 7F, 7L scale by 49</text>
<text x="410" y="156" font-size="13"  fill="#166534">Unbalanced U(1,6): columns constant,</text>
<text x="410" y="178" font-size="13"  fill="#166534">  but c_k = U0² − (−1)^k U(−k)², not e·c_k</text>
<text x="410" y="200" font-size="13"  fill="#166534">p.230 row 0,37,−15,82,−399,485 =</text>
<text x="410" y="222" font-size="13"  fill="#166534">  mirrored pairing at k = 1, 4</text>
<text x="410" y="244" font-size="13" font-weight="bold" fill="#b91c1c">p.125 identity: sign fix needed</text>
<text x="410" y="266" font-size="13"  fill="#222">U(x−r)U(x+r) − U(x−a)U(x+a)</text>
<text x="410" y="288" font-size="13"  fill="#222">  = (−1)^(x−a) · e · F(a−r)F(a+r)</text>
<text x="410" y="310" font-size="13"  fill="#555">  e = U1² − U0U1 − U0² (norm in ℤ[φ])</text>
<text x="410" y="332" font-size="13"  fill="#555">As printed, (−1)^(x−r) works only with</text>
<text x="410" y="354" font-size="13"  fill="#555">  F(r−a) and CI = −e (signed Cassini)</text>
<text x="20" y="385" font-size="11" fill="#777">Blue = positive, red = negative. Math labels: identities proven by exhaustive check |x|,|r|,|a| ≤ 10; reading of photos tentative.</text></svg>