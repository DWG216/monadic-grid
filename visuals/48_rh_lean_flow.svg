<svg width="100%" viewBox="0 0 680 340" role="img"><title>How the Lean RH proof works, in grid terms</title><desc>Auxiliary host fields give a Sha budget; theta jets along a rank chain and a small-sections count against arithmetic volume feed a window inequality; a Landau step on conjugate character pairs turns it into zero-freeness, and the mirror gives RH.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="20" y="40" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="59" text-anchor="middle" dominant-baseline="central">Host field E</text><text class="ts" x="100" y="78" text-anchor="middle" dominant-baseline="central">2-adic layer, ψ, q, d</text></g>
<g class="c-purple"><rect x="200" y="40" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="270" y="59" text-anchor="middle" dominant-baseline="central">Sha budget</text><text class="ts" x="270" y="78" text-anchor="middle" dominant-baseline="central">Sel · log l weights</text></g>
<g class="c-purple"><rect x="20" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="169" text-anchor="middle" dominant-baseline="central">Theta jets</text><text class="ts" x="100" y="188" text-anchor="middle" dominant-baseline="central">Pun^m · rank chain</text></g>
<g class="c-purple"><rect x="20" y="260" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="279" text-anchor="middle" dominant-baseline="central">Small sections</text><text class="ts" x="100" y="298" text-anchor="middle" dominant-baseline="central">Bal · volume</text></g>
<g class="c-coral"><rect x="360" y="150" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="435" y="169" text-anchor="middle" dominant-baseline="central">Window inequality</text><text class="ts" x="435" y="188" text-anchor="middle" dominant-baseline="central">Win · [Y, Y^3/2]</text></g>
<g class="c-teal"><rect x="525" y="150" width="125" height="56" rx="8" stroke-width="0.5"/><text class="th" x="587" y="169" text-anchor="middle" dominant-baseline="central">Landau step</text><text class="ts" x="587" y="188" text-anchor="middle" dominant-baseline="central">pairs χ, χ̄ · M</text></g>
<g class="c-gray"><rect x="525" y="260" width="125" height="56" rx="8" stroke-width="0.5"/><text class="th" x="587" y="279" text-anchor="middle" dominant-baseline="central">Zero-free → RH</text><text class="ts" x="587" y="298" text-anchor="middle" dominant-baseline="central">mirror closes left</text></g>
<line x1="180" y1="68" x2="198" y2="68" class="arr" marker-end="url(#arrow)"/>
<path d="M270 96 L270 120 L435 120 L435 148" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="178" x2="358" y2="178" class="arr" marker-end="url(#arrow)"/>
<path d="M180 288 L280 288 L280 196 L358 196" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="178" x2="523" y2="178" class="arr" marker-end="url(#arrow)"/>
<line x1="587" y1="206" x2="587" y2="258" class="arr" marker-end="url(#arrow)"/>
