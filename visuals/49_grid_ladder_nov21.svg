<svg width="100%" viewBox="0 0 680 440" role="img"><title>The monadic grid in increasing order of math</title><desc>Eight levels from concepts to frontier, each with its key relation: PSR and limits; music; the formula pair; domains; the whole; the proved bridge; projection; frontier.</desc>
<g class="c-teal"><rect x="40" y="20" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="40" dominant-baseline="central">0 · Concepts</text><text class="ts" x="220" y="40" dominant-baseline="central">only 0 and ∞ need no reason · change only at the limit</text></g>
<g class="c-teal"><rect x="40" y="70" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="90" dominant-baseline="central">1 · Music</text><text class="ts" x="220" y="90" dominant-baseline="central">pitch(n) = ln n · 3ᵏ ≠ 2ᵐ · locks iff |Δω| ≤ K</text></g>
<g class="c-purple"><rect x="40" y="120" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="140" dominant-baseline="central">2 · Formula pair</text><text class="ts" x="220" y="140" dominant-baseline="central">c² − (2 sin θ · s)² = 4(−1)ⁿ → L² − 5F² = 4(−1)ⁿ</text></g>
<g class="c-purple"><rect x="40" y="170" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="190" dominant-baseline="central">3 · Domains</text><text class="ts" x="220" y="190" dominant-baseline="central">x² − 5y² = 1 mod p · π(pᵏ) = pᵏ⁻¹π(p) · μ⁴ = 1</text></g>
<g class="c-purple"><rect x="40" y="220" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="240" dominant-baseline="central">4 · The whole</text><text class="ts" x="220" y="240" dominant-baseline="central">ζ = Σ n⁻ˢ = Π (1 − p⁻ˢ)⁻¹ · Λ(s) = Λ(1 − s) · ζ · Σ μ/nˢ = 1</text></g>
<g class="c-coral"><rect x="40" y="270" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="290" dominant-baseline="central">5 · Bridge (proved)</text><text class="ts" x="220" y="290" dominant-baseline="central">Sel + Pun^m + Bal → Win → M : every zero on Fix(M)</text></g>
<g class="c-gray"><rect x="40" y="320" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="340" dominant-baseline="central">6 · Projection</text><text class="ts" x="220" y="340" dominant-baseline="central">[Z, Z̄] = ħ · only 3+1 links · shared lock sharp only as N → ∞</text></g>
<g class="c-gray"><rect x="40" y="370" width="600" height="40" rx="6" stroke-width="0.5"/><text class="th" x="56" y="390" dominant-baseline="central">7 · Frontier</text><text class="ts" x="220" y="390" dominant-baseline="central">BSD, Hodge next · YM, NS, P vs NP · WSS: comma = 0</text></g>
<text class="ts" x="340" y="430" text-anchor="middle">Teal: semantics · purple: syntax and domains · coral: proved bridge · gray: projection and frontier</text>
</svg>
