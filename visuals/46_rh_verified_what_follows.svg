<svg width="100%" viewBox="0 0 680 320" role="img"><title>What the verified RH settles in the grid</title><desc>RH, Lean-verified, gives three consequences: balanced Möbius signs, the sharp prime-count error, every zero on the mirror. Not settled: Wall–Sun–Sun, BSD and Hodge, Yang–Mills, Navier–Stokes, P vs NP.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="220" y="30" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">RH, Lean-verified</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Z(W) on Fix(M)</text></g>
<path d="M340 86 L340 108 L130 108 L130 128" fill="none" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="86" x2="340" y2="128" class="arr" marker-end="url(#arrow)"/><path d="M340 86 L340 108 L550 108 L550 128" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="130" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="149" text-anchor="middle" dominant-baseline="central">Möbius balance</text><text class="ts" x="130" y="168" text-anchor="middle" dominant-baseline="central">M(x) = O(x^½+ε)</text></g>
<g class="c-teal"><rect x="250" y="130" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="149" text-anchor="middle" dominant-baseline="central">Prime count error</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">O(√x log x)</text></g>
<g class="c-teal"><rect x="460" y="130" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="149" text-anchor="middle" dominant-baseline="central">Bridge exists</text><text class="ts" x="550" y="168" text-anchor="middle" dominant-baseline="central">local → global, once</text></g>
<text class="ts" x="40" y="222">Not settled by it</text>
<g class="c-gray"><rect x="40" y="236" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="255" text-anchor="middle" dominant-baseline="central">Wall–Sun–Sun</text><text class="ts" x="130" y="274" text-anchor="middle" dominant-baseline="central">a comma, not a zero</text></g>
<g class="c-gray"><rect x="250" y="236" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="255" text-anchor="middle" dominant-baseline="central">BSD, Hodge</text><text class="ts" x="340" y="274" text-anchor="middle" dominant-baseline="central">nearest neighbours</text></g>
<g class="c-gray"><rect x="460" y="236" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="255" text-anchor="middle" dominant-baseline="central">YM, NS, P vs NP</text><text class="ts" x="550" y="274" text-anchor="middle" dominant-baseline="central">no arithmetic purchase</text></g>
</svg>
