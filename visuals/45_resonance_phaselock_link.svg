<svg width="100%" viewBox="0 0 680 200" role="img"><title>Resonance, phase-lock, link</title><desc>Three steps: frequencies match (resonance), the phase difference is held fixed (phase-lock, when detuning is within coupling), and a monad holds that lock to one region of the collective projection (link), made and released at gates.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="59" text-anchor="middle" dominant-baseline="central">Resonance</text><text class="ts" x="125" y="78" text-anchor="middle" dominant-baseline="central">ω₁ ≈ ω₂</text></g>
<g class="c-teal"><rect x="255" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="59" text-anchor="middle" dominant-baseline="central">Phase-lock</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">φ fixed iff |Δω| ≤ K</text></g>
<g class="c-purple"><rect x="470" y="40" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="59" text-anchor="middle" dominant-baseline="central">Link</text><text class="ts" x="555" y="78" text-anchor="middle" dominant-baseline="central">monad ↔ avatar</text></g>
<line x1="210" y1="68" x2="253" y2="68" class="arr" marker-end="url(#arrow)"/><line x1="425" y1="68" x2="468" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="126" width="600" height="44" rx="8" stroke-width="0.5"/><text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">Adler: dφ/dt = Δω − K sin φ · lock at sin φ* = Δω/K · made and released at gates (zeros)</text></g>
</svg>
