<svg width="100%" viewBox="0 0 680 400" role="img"><title>Fibonacci modulo 3 on the nine-point plane</title><desc>The pairs (F(n), F(n+1)) modulo 3 visit all eight non-zero points of the 3 by 3 plane in one 8-step cycle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="270.0" y1="180.0" x2="318.0" y2="180.0" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340.0" y1="160.0" x2="340.0" y2="112.0" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="348.9" y1="107.9" x2="420.2" y2="250.3" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="415.9" y1="255.9" x2="265.6" y2="105.6" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="270.0" y1="90.0" x2="408.0" y2="90.0" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="430.0" y1="110.0" x2="430.0" y2="158.0" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="415.9" y1="194.1" x2="355.6" y2="254.4" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="325.9" y1="255.9" x2="265.6" y2="195.6" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow)"/>
<g class="c-gray"><circle cx="250" cy="270" r="16" stroke-width="0.5"/><text class="ts" x="250" y="270" text-anchor="middle" dominant-baseline="central">0,0</text></g>
<g class="c-coral"><circle cx="250" cy="180" r="16" stroke-width="0.5"/><text class="ts" x="250" y="180" text-anchor="middle" dominant-baseline="central">0,1</text></g>
<text class="ts" x="272" y="162">0</text>
<g class="c-coral"><circle cx="250" cy="90" r="16" stroke-width="0.5"/><text class="ts" x="250" y="90" text-anchor="middle" dominant-baseline="central">0,2</text></g>
<text class="ts" x="272" y="72">4</text>
<g class="c-coral"><circle cx="340" cy="270" r="16" stroke-width="0.5"/><text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">1,0</text></g>
<text class="ts" x="362" y="252">7</text>
<g class="c-coral"><circle cx="340" cy="180" r="16" stroke-width="0.5"/><text class="ts" x="340" y="180" text-anchor="middle" dominant-baseline="central">1,1</text></g>
<text class="ts" x="362" y="162">1</text>
<g class="c-coral"><circle cx="340" cy="90" r="16" stroke-width="0.5"/><text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">1,2</text></g>
<text class="ts" x="362" y="72">2</text>
<g class="c-coral"><circle cx="430" cy="270" r="16" stroke-width="0.5"/><text class="ts" x="430" y="270" text-anchor="middle" dominant-baseline="central">2,0</text></g>
<text class="ts" x="452" y="252">3</text>
<g class="c-coral"><circle cx="430" cy="180" r="16" stroke-width="0.5"/><text class="ts" x="430" y="180" text-anchor="middle" dominant-baseline="central">2,1</text></g>
<text class="ts" x="452" y="162">6</text>
<g class="c-coral"><circle cx="430" cy="90" r="16" stroke-width="0.5"/><text class="ts" x="430" y="90" text-anchor="middle" dominant-baseline="central">2,2</text></g>
<text class="ts" x="452" y="72">5</text>
<text class="ts" x="340" y="372" text-anchor="middle">Step n sits at (F(n), F(n+1)) mod 3; small numbers give the step. All 8 non-zero points, once each</text></svg>